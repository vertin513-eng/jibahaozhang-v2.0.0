/* ==========================================================================
   记把好账 · 样式
   移动端优先（320–480px），安全区适配，跟随系统深色模式。
   ========================================================================== */

:root {
  --bg: #f3f7f2;
  --bg-deep: #e6eee4;
  --card: #ffffff;
  --card-2: #f6f9f5;
  --line: #e3eae1;
  --text: #1b2a21;
  --text-2: #5b6b61;
  --text-3: #8b9a90;
  --primary: #4f9d69;
  --primary-strong: #3c8253;
  --primary-soft: rgba(79, 157, 105, 0.13);
  --income: #2f9e6e;
  --expense: #22352a;
  --danger: #d9534f;
  --warn: #c9802c;
  --chart-grid: #e9efe7;
  --chart-track: #edf2ec;
  --tabbar-bg: rgba(255, 255, 255, 0.92);
  --sheet-bg: #ffffff;
  --shadow: 0 8px 24px rgba(32, 63, 43, 0.07);
  --shadow-lg: 0 18px 44px rgba(28, 56, 38, 0.14);
  --radius: 22px;
  --tabbar-h: 62px;
}

html[data-mode='dark'] {
  --bg: #0f1511;
  --bg-deep: #0a0f0c;
  --card: #1a231d;
  --card-2: #202b23;
  --line: #2a362d;
  --text: #e9f2eb;
  --text-2: #a6b6aa;
  --text-3: #7d8f82;
  --primary: #6cbd87;
  --primary-strong: #8ed3a3;
  --primary-soft: rgba(108, 189, 135, 0.16);
  --income: #57c08c;
  --expense: #eef6f0;
  --danger: #ef7f76;
  --warn: #e0a458;
  --chart-grid: #2a362d;
  --chart-track: #25312a;
  --tabbar-bg: rgba(18, 24, 20, 0.92);
  --sheet-bg: #1a231d;
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
  --shadow-lg: 0 22px 52px rgba(0, 0, 0, 0.5);
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100dvh;
  background:
    radial-gradient(1200px 600px at 50% -8%, var(--bg-deep), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro SC', 'PingFang SC', 'Hiragino Sans GB',
    'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}

body.sheet-open {
  overflow: hidden;
}

@media (min-width: 520px) {
  body {
    padding: 0;
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(79, 157, 105, 0.14), transparent 65%),
      #dde8db;
  }
  html[data-mode='dark'] body {
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(108, 189, 135, 0.1), transparent 65%),
      #070b09;
  }
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  cursor: default;
}

a {
  color: var(--primary);
}

h1,
h2,
h3,
p {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.svg-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;

  width: 24px;
  height: 24px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

.app {
  position: relative;
  width: 100%;
  max-width: 480px;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  overflow-x: hidden;
  isolation: isolate;
}

@media (min-width: 520px) {
  .app {
    box-shadow: 0 30px 80px rgba(23, 46, 30, 0.18);
  }
}

.view {
  min-height: 100dvh;
}

.page {
  padding: calc(10px + env(safe-area-inset-top)) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);
  animation: page-in 0.24s ease both;
}

.page-home {
  /* 首页改为两个主按钮，不再需要为吸底总结额外留白 */
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
}

@keyframes page-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* ---------------- 通用文字 / 头部 ---------------- */

.eyebrow {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 0.02em;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 2px 8px;
}

.page-head-main h1 {
  font-size: 22px;
  line-height: 1.3;
  letter-spacing: -0.02em;
  margin-top: 3px;
  font-weight: 700;
}

.detail-head {
  align-items: center;
  gap: 10px;
}

.detail-head .page-head-main {
  flex: 1;
  min-width: 0;
}

.detail-head .page-head-main h1 {
  font-size: 18px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--text-2);
  flex: none;
  transition: transform 0.15s ease, background 0.15s ease;
}

.icon-btn:active {
  transform: scale(0.94);
}

.icon-btn .icon {
  width: 21px;
  height: 21px;
}

.ghost-btn {
  padding: 7px 13px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text-2);
  font-size: 12.5px;
  flex: none;
}

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  color: var(--primary);
  font-size: 12.5px;
  font-weight: 600;
}

.link-btn .icon {
  width: 15px;
  height: 15px;
}

.btn-primary {
  min-height: 48px;
  padding: 0 20px;
  border-radius: 15px;
  background: var(--primary);
  color: #fff;
  font-weight: 650;
  font-size: 15%;
  font-size: 15px;
  letter-spacing: 0.01em;
  box-shadow: 0 8px 18px rgba(79, 157, 105, 0.25);
  transition: transform 0.14s ease, filter 0.14s ease;
}

.btn-primary:active {
  transform: scale(0.985);
  filter: brightness(0.96);
}

.btn-danger {
  background: var(--danger);
  box-shadow: 0 8px 18px rgba(217, 83, 79, 0.22);
}

.btn-ghost {
  min-height: 48px;
  padding: 0 18px;
  border-radius: 15px;
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--text-2);
  font-weight: 600;
}

.btn-soft {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding: 10px 16px;
  border-radius: 13px;
  background: var(--primary-soft);
  color: var(--primary-strong);
  font-size: 13.5px;
  font-weight: 600;
}

html[data-mode='dark'] .btn-soft {
  color: var(--primary);
}

.btn-soft .icon {
  width: 17px;
  height: 17px;
}

.btn-block {
  display: block;
  width: 100%;
}

.card {
  margin-top: 14px;
  padding: 18px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.section-note {
  font-size: 11.5px;
  color: var(--text-3);
  font-weight: 400;
}

.empty {
  padding: 26px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: var(--text-3);
}

.empty-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--card-2);
  color: var(--text-3);
  margin-bottom: 10px;
}

.empty-icon .icon {
  width: 24px;
  height: 24px;
}

.empty strong {
  font-size: 14px;
  color: var(--text);
  font-weight: 600;
}

.empty p {
  margin-top: 4px;
  font-size: 12px;
  max-width: 250px;
  line-height: 1.55;
}

/* ---------------- 首页 ---------------- */

.home-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 2px 10px;
}

.home-date {
  font-size: 28px;
  font-weight: 750;
  letter-spacing: -0.035em;
  line-height: 1.15;
  margin: 2px 0 3px;
}

.home-sub {
  font-size: 12px;
  color: var(--text-3);
}

.avatar-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--primary-soft);
  color: var(--primary-strong);
  border: 1px solid rgba(79, 157, 105, 0.16);
  flex: none;
  transition: transform 0.15s ease;
}

html[data-mode='dark'] .avatar-btn {
  color: var(--primary);
  border-color: rgba(108, 189, 135, 0.2);
}

.avatar-btn:active {
  transform: scale(0.94);
}

.avatar-btn .icon {
  width: 23px;
  height: 23px;
}

.demo-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  padding: 8px 12px;
  border-radius: 13px;
  background: var(--primary-soft);
  color: var(--primary-strong);
  font-size: 11.5px;
}

html[data-mode='dark'] .demo-banner {
  color: var(--primary);
}

.demo-banner > span {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

.demo-banner .icon {
  width: 14px;
  height: 14px;
}

.demo-banner .link-btn {
  flex: none;
  font-size: 11.5px;
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* 预算条 */
.budget-card {
  display: block;
  width: 100%;
  text-align: left;
  padding: 15px 17px 14px;
  border-radius: 20px;
  border: 1px solid rgba(79, 157, 105, 0.18);
  background:
    radial-gradient(140% 130% at 0% 0%, var(--primary-soft), transparent 62%),
    var(--card);
  box-shadow: var(--shadow);
  transition: transform 0.16s ease;
}

.budget-card:active {
  transform: scale(0.992);
}

.budget-card.is-over {
  border-color: rgba(217, 83, 79, 0.28);
  background:
    radial-gradient(140% 130% at 0% 0%, rgba(217, 83, 79, 0.12), transparent 62%),
    var(--card);
}

.budget-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.budget-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-2);
  font-weight: 600;
}

.budget-label .icon {
  width: 15px;
  height: 15px;
  color: var(--primary);
}

.budget-card.is-over .budget-label,
.budget-card.is-over .budget-label .icon {
  color: var(--danger);
}

.budget-link {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  color: var(--text-3);
}

.budget-link .icon {
  width: 14px;
  height: 14px;
}

.budget-amount {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 5px 0 8px;
}

.budget-amount strong {
  font-size: 25px;
  font-weight: 750;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.budget-amount span {
  font-size: 11px;
  color: var(--text-3);
}

.budget-card.is-empty .budget-amount strong {
  font-size: 18px;
  letter-spacing: -0.01em;
}

.budget-card.is-empty .budget-amount {
  margin: 8px 0 4px;
}

.budget-hint {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 4px;
}

.budget-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-3);
}

.budget-foot b {
  color: var(--text-2);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.progress {
  height: 6px;
  border-radius: 999px;
  background: var(--chart-track);
  overflow: hidden;
}

.progress > i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--primary);
  transition: width 0.35s ease;
}

.budget-card.is-over .progress > i {
  background: var(--danger);
}

/* 三餐 */
.meal-section {
  margin-top: 12px;
}

.meal-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.meal-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 112px;
  padding: 13px 12px 12px;
  border-radius: 20px;
  background:
    radial-gradient(120% 100% at 0% 0%, var(--ms), transparent 70%),
    var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  text-align: left;
  transition: transform 0.15s ease, border-color 0.15s ease;
}

.meal-card:active {
  transform: scale(0.965);
}

.meal-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--ms);
  color: var(--mc);
  margin-bottom: 9px;
}

.meal-icon .icon {
  width: 20px;
  height: 20px;
}

.meal-name {
  font-size: 13px;
  font-weight: 650;
  color: var(--text);
}

.meal-amount {
  margin-top: 1px;
  font-size: 13px;
  font-weight: 650;
  color: var(--mc);
  font-variant-numeric: tabular-nums;
}

/* 分类快捷 */
.quick-section {
  margin-top: 16px;
}

.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.cat-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 82px;
  padding: 10px 4px;
  border-radius: 18px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transition: transform 0.14s ease;
}

.cat-btn:active {
  transform: scale(0.95);
}

.cat-icon {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: var(--cs, var(--card-2));
  color: var(--c, var(--text-2));
  flex: none;
}

.cat-icon .icon {
  width: 20px;
  height: 20px;
}

.cat-icon.income {
  background: var(--primary-soft);
  color: var(--primary-strong);
}

html[data-mode='dark'] .cat-icon.income {
  color: var(--primary);
}

.cat-name {
  font-size: 12px;
  font-weight: 550;
  color: var(--text-2);
}

.cat-income {
  grid-column: span 2;
  flex-direction: row;
  gap: 10px;
  background: linear-gradient(120deg, var(--primary-soft), var(--card) 80%);
  border-color: rgba(79, 157, 105, 0.2);
}

.cat-income .cat-name {
  color: var(--primary-strong);
  font-weight: 650;
}

html[data-mode='dark'] .cat-income .cat-name {
  color: var(--primary);
}

/* 今日账单 */
.recent-section {
  margin-top: 20px;
}

.recent-card {
  padding: 2px 16px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.recent-empty {
  padding: 18px 0;
  text-align: center;
  color: var(--text-3);
  font-size: 12.5px;
}

.tx-list .tx-row:last-child {
  border-bottom: 0;
}

.tx-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.tx-ico {
  width: 38px;
  height: 38px;
  border-radius: 12px;
}

.tx-ico .icon {
  width: 19px;
  height: 19px;
}

.tx-main {
  flex: 1;
  min-width: 0;
}

.tx-title {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
}

.tx-note {
  font-size: 11.5px;
  font-weight: 400;
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.tx-meta {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}

.tx-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  flex: none;
}

.tx-amt {
  font-size: 14.5px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.tx-amt.expense {
  color: var(--expense);
}

.tx-amt.income {
  color: var(--income);
}

.tx-acts {
  display: flex;
  gap: 2px;
}

.mini-btn {
  width: 26px;
  height: 24px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  color: var(--text-3);
  background: transparent;
}

.mini-btn:active {
  background: var(--card-2);
}

.mini-btn .icon {
  width: 15px;
  height: 15px;
}

.mini-btn.danger {
  color: var(--danger);
}

/* 今日总结（固定在 Tab 栏上方） */
.daily-card {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 30;
  display: block;
  width: calc(100% - 32px);
  max-width: 448px;
  margin: 0;
  padding: 14px 17px 13px;
  border-radius: 22px;
  text-align: left;
  color: #fff;
  background:
    radial-gradient(130% 160% at 100% 0%, rgba(255, 255, 255, 0.22), transparent 55%),
    linear-gradient(135deg, var(--primary-strong), var(--primary));
  box-shadow: 0 14px 30px rgba(45, 104, 66, 0.32);
}

html[data-mode='dark'] .daily-card {
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
}

.daily-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  opacity: 0.86;
}

.daily-head > span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.daily-head .icon {
  width: 14px;
  height: 14px;
}

.daily-link {
  opacity: 0.9;
}

.daily-link .icon {
  width: 13px;
  height: 13px;
}

.daily-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 6px;
  margin-top: 9px;
}

.daily-item {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.daily-item span {
  font-size: 10.5px;
  opacity: 0.8;
}

.daily-item strong {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.daily-item strong.expense,
.daily-item strong.income {
  color: #fff;
}

.daily-note {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.18);
  font-size: 11px;
  opacity: 0.85;
}

/* ---------------- 分段控件 / 圆按钮 ---------------- */

.segmented {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border-radius: 13px;
  background: var(--card-2);
  border: 1px solid var(--line);
  gap: 2px;
}

.seg {
  padding: 6px 13px;
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--text-2);
  white-space: nowrap;
  transition: background 0.16s ease, color 0.16s ease;
}

.seg.is-active {
  background: var(--card);
  color: var(--text);
  font-weight: 650;
  box-shadow: 0 2px 8px rgba(30, 60, 40, 0.08);
}

html[data-mode='dark'] .seg.is-active {
  background: var(--primary-soft);
  color: var(--primary);
  box-shadow: none;
}

.round-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--text-2);
  flex: none;
  transition: transform 0.14s ease;
}

.round-btn:active {
  transform: scale(0.93);
}

.round-btn .icon {
  width: 19px;
  height: 19px;
}

/* ---------------- 日历 ---------------- */

.cal-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 6px;
}

.cal-swipe-tip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10.5px;
  color: var(--text-3);
}

.cal-swipe-tip .icon {
  width: 13px;
  height: 13px;
}

.cal-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 2px 10px;
}

.cal-title {
  text-align: center;
  min-width: 0;
}

.cal-title strong {
  display: block;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.cal-title span {
  display: block;
  margin-top: 1px;
  font-size: 11px;
  color: var(--text-3);
}

.cal-title b {
  color: var(--text-2);
  font-weight: 600;
}

.cal-card {
  padding: 12px 9px 10px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  touch-action: pan-y;
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  padding: 1px 0 6px;
}

.cal-weekdays span {
  text-align: center;
  font-size: 10.5px;
  color: var(--text-3);
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 0;
  min-height: 57px;
  padding: 5px 0 3px;
  border-radius: 11px;
  color: var(--text);
  transition: background 0.15s ease, transform 0.12s ease;
}

.cal-cell:active {
  transform: scale(0.94);
}

.cal-num {
  font-size: 12.5px;
  line-height: 1.35;
  font-variant-numeric: tabular-nums;
}

.cal-amt {
  min-height: 12px;
  font-size: 9px;
  line-height: 1.2;
  font-weight: 650;
  color: var(--primary-strong);
  font-variant-numeric: tabular-nums;
}

html[data-mode='dark'] .cal-amt {
  color: var(--primary);
}

.cal-dots {
  display: flex;
  gap: 2px;
  height: 4px;
  margin-top: 2px;
}

.cal-dots i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  display: block;
}

.cal-cell.is-out {
  opacity: 0.28;
}

.cal-cell.is-today:not(.is-selected) {
  background: var(--primary-soft);
}

.cal-cell.is-today .cal-num {
  font-weight: 750;
}

.cal-cell.is-selected {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 6px 14px rgba(60, 130, 83, 0.26);
}

.cal-cell.is-selected .cal-amt {
  color: #fff;
}

.cal-cell.is-selected .cal-dots i {
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.65);
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: 3px 0 6px;
}

.week-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 9px 0 7px;
  border-radius: 13px;
  background: var(--card-2);
  color: var(--text);
  transition: transform 0.12s ease;
}

.week-cell:active {
  transform: scale(0.95);
}

.week-wd {
  font-size: 9.5px;
  color: var(--text-3);
}

.week-num {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
}

.week-amt {
  font-size: 9px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.week-cell.is-today {
  background: var(--primary-soft);
}

.week-cell.is-selected {
  background: var(--primary);
  color: #fff;
}

.week-cell.is-selected .week-wd,
.week-cell.is-selected .week-amt {
  color: rgba(255, 255, 255, 0.82);
}

.week-cell.is-selected .cal-dots i {
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.65);
}

.day-panel {
  margin-top: 14px;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.day-panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 6px;
}

.day-panel-head h2 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.day-panel-head p {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--text-3);
}

.day-panel-head p b {
  font-size: 13px;
}

.day-panel-head .link-btn {
  padding-top: 2px;
  flex: none;
}

.expense {
  color: var(--expense);
}

.income {
  color: var(--income);
}

.day-panel .tx-row:last-child {
  border-bottom: 0;
}

.add-more {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 12px;
  border: 1px dashed var(--line);
  color: var(--text-3);
  font-size: 12px;
}

.add-more .icon {
  width: 15px;
  height: 15px;
}

/* ---------------- 日账单详情 ---------------- */

.detail-hero {
  margin-top: 12px;
  padding: 20px 20px 18px;
  border-radius: 26px;
  background:
    radial-gradient(140% 130% at 0% 0%, var(--primary-soft), transparent 62%),
    var(--card);
  border: 1px solid rgba(79, 157, 105, 0.16);
  box-shadow: var(--shadow);
}

.hero-label {
  font-size: 12px;
  color: var(--text-2);
  font-weight: 600;
}

.hero-amount {
  display: flex;
  align-items: baseline;
  margin: 4px 0 10px;
  color: var(--text);
}

.hero-cur {
  font-size: 21px;
  font-weight: 600;
  margin-right: 3px;
  opacity: 0.6;
}

.hero-amount strong {
  font-size: 40px;
  line-height: 1.1;
  font-weight: 750;
  letter-spacing: -0.045em;
  font-variant-numeric: tabular-nums;
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  padding-top: 11px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--text-3);
}

.hero-meta b {
  color: var(--text-2);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.compare-card {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 12px;
  padding: 13px 15px;
  border-radius: 17px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.compare-card > .icon {
  width: 21px;
  height: 21px;
  flex: none;
  color: var(--text-3);
}

.compare-card b {
  display: block;
  font-size: 12.5px;
  font-weight: 650;
}

.compare-card span {
  display: block;
  margin-top: 1px;
  font-size: 11px;
  color: var(--text-3);
}

.compare-card.is-up {
  border-color: rgba(217, 83, 79, 0.22);
  background: linear-gradient(120deg, rgba(217, 83, 79, 0.07), var(--card));
}

.compare-card.is-up > .icon,
.compare-card.is-up b {
  color: var(--danger);
}

.compare-card.is-down {
  border-color: rgba(47, 158, 110, 0.2);
  background: linear-gradient(120deg, rgba(47, 158, 110, 0.06), var(--card));
}

.compare-card.is-down > .icon,
.compare-card.is-down b {
  color: var(--income);
}

.donut-layout {
  display: flex;
  align-items: center;
  gap: 14px;
}

.donut {
  position: relative;
  flex: none;
  width: var(--donut-size);
  height: var(--donut-size);
}

.donut svg {
  display: block;
}

.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  pointer-events: none;
  padding: 0 18px;
  text-align: center;
}

.donut-top {
  font-size: 9.5px;
  color: var(--text-3);
}

.donut-value {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.donut-sub {
  font-size: 9px;
  color: var(--text-3);
}

.legend {
  flex: 1;
  min-width: 0;
}

.legend-row {
  display: grid;
  grid-template-columns: 7px minmax(0, 1fr) auto 34px;
  align-items: center;
  gap: 7px;
  padding: 3.5px 0;
  font-size: 11.5px;
}

.legend-row i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.legend-name {
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.legend-row b {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  font-size: 11px;
}

.legend-row em {
  font-style: normal;
  color: var(--text-3);
  text-align: right;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}

.meal-stats {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.meal-stat {
  display: flex;
  align-items: center;
  gap: 10px;
}

.meal-stat-icon {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--cs);
  color: var(--c);
  flex: none;
}

.meal-stat-icon .icon {
  width: 18px;
  height: 18px;
}

.meal-stat-main {
  flex: 1;
  min-width: 0;
}

.meal-stat-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
  font-size: 12px;
}

.meal-stat-title span {
  font-weight: 600;
}

.meal-stat-title em {
  font-style: normal;
  font-size: 10px;
  color: var(--text-3);
}

.meal-stat .progress {
  height: 5px;
}

.meal-stat-val {
  text-align: right;
  flex: none;
  min-width: 72px;
}

.meal-stat-val b {
  display: block;
  font-size: 12.5px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.meal-stat-val span {
  display: block;
  font-size: 9.5px;
  color: var(--text-3);
}

.meal-sum {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-top: 13px;
  padding-top: 11px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--text-3);
}

.meal-sum b {
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.meal-sum span {
  font-size: 10.5px;
  text-align: right;
}

/* ---------------- 统计 ---------------- */

.page-stats > .segmented {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  width: 100%;
  margin-top: 4px;
}

.page-stats > .segmented .seg {
  text-align: center;
  padding: 7px 0;
}

.period-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 0 12px;
}

.period-title {
  text-align: center;
  min-width: 0;
}

.period-title strong {
  display: block;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.period-title span {
  display: block;
  margin-top: 1px;
  font-size: 10.5px;
  color: var(--text-3);
}

.stat-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.stat-cell {
  padding: 13px 15px;
  border-radius: 18px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  min-width: 0;
}

.stat-cell > span {
  font-size: 10.5px;
  color: var(--text-3);
}

.stat-cell strong {
  display: block;
  margin-top: 2px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stat-cell em {
  display: block;
  margin-top: 1px;
  font-style: normal;
  font-size: 10px;
  color: var(--text-3);
}

.legend-inline {
  display: flex;
  gap: 12px;
  font-size: 10.5px;
  color: var(--text-3);
}

.legend-inline span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}

.dot.expense {
  background: #e07a5f;
}

.dot.income {
  background: #3fa876;
}

.line-chart {
  margin: 2px -2px -2px;
}

.line-chart svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.chart-axis {
  fill: var(--text-3);
  font-size: 9.5px;
  font-family: inherit;
}

/* ---------------- 预算 ---------------- */

.budget-hero {
  margin-top: 12px;
  padding: 19px 20px 18px;
  border-radius: 26px;
  background:
    radial-gradient(140% 140% at 100% 0%, var(--primary-soft), transparent 60%),
    linear-gradient(135deg, var(--card), var(--card));
  border: 1px solid rgba(79, 157, 105, 0.17);
  box-shadow: var(--shadow);
}

.budget-hero.is-over {
  border-color: rgba(217, 83, 79, 0.28);
  background:
    radial-gradient(140% 140% at 100% 0%, rgba(217, 83, 79, 0.13), transparent 60%),
    var(--card);
}

.budget-hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-2);
  font-weight: 600;
}

.budget-hero-badge {
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary-strong);
  font-size: 10px;
  font-weight: 600;
}

html[data-mode='dark'] .budget-hero-badge {
  color: var(--primary);
}

.budget-hero.is-over .budget-hero-badge {
  background: rgba(217, 83, 79, 0.12);
  color: var(--danger);
}

.budget-hero-amount {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 6px 0 12px;
}

.budget-hero-amount small {
  font-size: 12px;
  color: var(--text-3);
}

.budget-hero-amount strong {
  font-size: 38px;
  font-weight: 750;
  letter-spacing: -0.045em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.budget-hero-amount strong.is-empty {
  font-size: 22px;
  letter-spacing: 0;
  color: var(--text-3);
  align-self: center;
}

.budget-hero-tip {
  font-size: 11.5px;
  color: var(--text-3);
}

.budget-hero-progress .progress {
  height: 8px;
}

.budget-hero-meta {
  display: flex;
  justify-content: space-between;
  margin-top: 7px;
  font-size: 10.5px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.insight-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.insight {
  padding: 11px 12px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  min-width: 0;
}

.insight span {
  display: block;
  font-size: 9.5px;
  color: var(--text-3);
}

.insight b {
  display: block;
  margin-top: 2px;
  font-size: 13.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.budget-form {
  margin-top: 4px;
}

.money-input {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 9px 12px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--card-2);
  min-width: 106px;
}

.money-input span {
  font-size: 13px;
  color: var(--text-3);
  flex: none;
}

.money-input input {
  width: 100%;
  min-width: 0;
  border: 0;
  background: transparent;
  padding: 0;
  font-size: 16px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  text-align: right;
  outline: none;
  -moz-appearance: textfield;
  appearance: textfield;
}

.money-input input::-webkit-outer-spin-button,
.money-input input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.money-input.large {
  padding: 13px 15px;
  border-radius: 16px;
  min-width: 0;
}

.money-input.large input {
  font-size: 27px;
  text-align: left;
  font-weight: 750;
  letter-spacing: -0.03em;
}

.money-input.large span {
  font-size: 19px;
}

.money-input.compact {
  width: 104px;
  flex: none;
  min-width: 0;
  padding: 7px 9px;
}

.money-input.compact input {
  width: 100%;
}

.money-input.compact input {
  font-size: 15px;
}

.form-tip {
  margin-top: 8px;
  font-size: 10.5px;
  color: var(--text-3);
  line-height: 1.6;
}

.budget-row {
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}

.budget-row:last-child {
  border-bottom: 0;
}

.budget-row-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.budget-row-main {
  flex: 1;
  min-width: 0;
}

.budget-row-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}

.budget-row-title span {
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  flex: none;
}

.budget-row-title em {
  font-style: normal;
  font-size: 9.5px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  max-width: 60%;
  text-align: right;
}

.budget-row .progress {
  height: 4px;
}

.budget-form .btn-block {
  margin-top: 16px;
}

/* ---------------- 我的 ---------------- */

.me-head {
  margin: 8px 0 4px;
  padding: 20px 18px 16px;
  border-radius: 26px;
  background:
    radial-gradient(140% 150% at 100% 0%, var(--primary-soft), transparent 60%),
    var(--card);
  border: 1px solid rgba(79, 157, 105, 0.16);
  box-shadow: var(--shadow);
}

.me-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--primary), var(--primary-strong));
  color: #fff;
  box-shadow: 0 8px 18px rgba(79, 157, 105, 0.28);
}

.logo .icon {
  width: 26px;
  height: 26px;
}

.me-brand h1 {
  font-size: 19px;
  font-weight: 750;
  letter-spacing: -0.02em;
}

.me-brand p {
  font-size: 10.5px;
  color: var(--text-3);
  margin-top: 1px;
}

.me-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 16px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}

.me-metrics span {
  display: block;
  font-size: 9.5px;
  color: var(--text-3);
}

.me-metrics b {
  display: block;
  margin-top: 1px;
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.group {
  margin-top: 18px;
}

.group-title {
  padding: 0 4px 7px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

.group-card {
  padding: 0 16px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.list-row {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 13px 0;
  text-align: left;
  border-bottom: 1px solid var(--line);
}

.list-row:last-child {
  border-bottom: 0;
}

.list-row.danger .row-title {
  color: var(--danger);
}

.row-icon {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--card-2);
  color: var(--text-2);
  flex: none;
}

.row-icon.primary {
  background: var(--primary-soft);
  color: var(--primary-strong);
}

html[data-mode='dark'] .row-icon.primary {
  color: var(--primary);
}

.row-icon.danger {
  background: rgba(217, 83, 79, 0.1);
  color: var(--danger);
}

.row-icon .icon {
  width: 19px;
  height: 19px;
}

.row-main {
  flex: 1;
  min-width: 0;
}

.row-title {
  font-size: 13.5px;
  font-weight: 600;
}

.row-sub {
  margin-top: 1px;
  font-size: 10.5px;
  color: var(--text-3);
  line-height: 1.45;
}

.row-arrow {
  color: var(--text-3);
  flex: none;
}

.row-arrow .icon {
  width: 17px;
  height: 17px;
}

.reminder-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.reminder-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

.time-input {
  width: 94px;
  padding: 5px 4px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--card-2);
  font-size: 16px;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
  text-align: center;
  outline: none;
}

.time-input:disabled {
  opacity: 0.4;
}

.switch {
  width: 45px;
  height: 27px;
  border-radius: 999px;
  background: var(--line);
  padding: 3px;
  flex: none;
  transition: background 0.2s ease;
}

.switch span {
  display: block;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
  transition: transform 0.2s ease;
}

.switch.is-on {
  background: var(--primary);
}

.switch.is-on span {
  transform: translateX(18px);
}

.permission-note {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 0 11px;
  font-size: 10.5px;
  color: var(--text-3);
  line-height: 1.5;
}

.permission-note .icon {
  width: 14px;
  height: 14px;
  flex: none;
}

.permission-note.is-ok {
  color: var(--income);
}

.permission-note span {
  flex: 1;
}

.permission-note .link-btn {
  flex: none;
  font-size: 10.5px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
}

.setting-divider {
  height: 1px;
  background: var(--line);
}

.theme-swatches {
  display: flex;
  gap: 12px;
  padding: 2px 0 15px;
}

.swatch {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--sw);
  display: grid;
  place-items: center;
  color: #fff;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
  transition: transform 0.15s ease;
}

.swatch:active {
  transform: scale(0.92);
}

.swatch.is-active {
  box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--sw);
}

.swatch .icon {
  width: 16px;
  height: 16px;
  stroke-width: 2.4;
}

.mode-switch {
  padding: 0 0 14px;
}

.mode-switch .segmented {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  width: 100%;
}

.mode-switch .seg {
  text-align: center;
}

.currency-input input {
  width: 58px;
  padding: 7px 9px;
  text-align: center;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card-2);
  font-size: 16px;
  font-weight: 650;
  outline: none;
}

.about-card {
  margin-top: 22px;
  padding: 22px 18px;
  border-radius: 22px;
  background: var(--card);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 5px;
}

.about-logo {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: var(--primary-soft);
  color: var(--primary);
  margin-bottom: 3px;
}

.about-logo .icon {
  width: 23px;
  height: 23px;
}

.about-card p {
  font-size: 12.5px;
  font-weight: 650;
}

.about-card > span {
  font-size: 10.5px;
  color: var(--text-3);
  line-height: 1.6;
  max-width: 290px;
}

.storage-note {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
}

.storage-note .icon {
  width: 12px;
  height: 12px;
}

/* ---------------- 底部导航 ---------------- */

.tabbar {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  z-index: 40;
  width: 100%;
  max-width: 480px;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding: 0 12px env(safe-area-inset-bottom);
  display: flex;
  align-items: stretch;
  background: var(--tabbar-bg);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--text-3);
  padding-bottom: 3px;
  transition: color 0.16s ease;
}

.tab-icon {
  width: 38px;
  height: 26px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  transition: background 0.18s ease, color 0.16s ease;
}

.tab-icon .icon {
  width: 21px;
  height: 21px;
  stroke-width: 1.65;
}

.tab-label {
  font-size: 9.5px;
  font-weight: 550;
}

.tab.is-active {
  color: var(--primary-strong);
}

html[data-mode='dark'] .tab.is-active {
  color: var(--primary);
}

.tab.is-active .tab-icon {
  background: var(--primary-soft);
}

/* ---------------- 金额输入面板 ---------------- */

#sheet-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
}

#sheet-root.is-open {
  pointer-events: auto;
}

.sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(10, 18, 12, 0.42);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 0.22s ease;
}

#sheet-root.is-open .sheet-backdrop {
  opacity: 1;
}

.sheet {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 100%;
  max-width: 480px;
  max-height: 92dvh;
  overflow-y: auto;
  transform: translate(-50%, 102%);
  transition: transform 0.3s cubic-bezier(0.22, 0.9, 0.3, 1);
  padding: 7px 18px calc(16px + env(safe-area-inset-bottom));
  border-radius: 28px 28px 0 0;
  background: var(--sheet-bg);
  box-shadow: 0 -20px 50px rgba(12, 26, 17, 0.22);
}

#sheet-root.is-open .sheet {
  transform: translate(-50%, 0);
}

.sheet-grip {
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: var(--line);
  margin: 2px auto 10px;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.sheet-cat {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.sheet-cat-icon {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: var(--cs);
  color: var(--c);
  flex: none;
}

.sheet-cat-icon .icon {
  width: 22px;
  height: 22px;
}

.sheet-cat strong {
  display: block;
  font-size: 15px;
  font-weight: 700;
}

.sheet-cat span:not(.sheet-cat-icon) {
  display: block;
  font-size: 10.5px;
  color: var(--text-3);
}

.sheet-head .icon-btn {
  background: var(--card-2);
  border-color: transparent;
}

.type-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  margin: 13px 0 2px;
  padding: 3px;
  border-radius: 13px;
  background: var(--card-2);
  border: 1px solid var(--line);
}

.type-toggle button {
  padding: 7px;
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--text-2);
  font-weight: 550;
}

.type-toggle button.is-active {
  background: var(--card);
  color: var(--text);
  font-weight: 650;
  box-shadow: 0 2px 7px rgba(30, 60, 40, 0.08);
}

html[data-mode='dark'] .type-toggle button.is-active {
  background: var(--primary-soft);
  color: var(--primary);
}

.amount-field {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 10px 2px 4px;
  border-bottom: 1.5px solid var(--line);
}

.amount-cur {
  font-size: 23px;
  font-weight: 600;
  color: var(--text-2);
  padding-top: 8px;
}

#amount-input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  outline: none;
  font-size: 44px;
  line-height: 1.2;
  font-weight: 750;
  letter-spacing: -0.04em;
  padding: 0;
  font-variant-numeric: tabular-nums;
}

#amount-input::placeholder {
  color: var(--line);
}

.quick-amounts {
  display: flex;
  gap: 7px;
  margin-top: 11px;
  flex-wrap: wrap;
}

.quick-amounts button {
  flex: 1;
  min-width: 54px;
  padding: 8px 2px;
  border-radius: 11px;
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
  transition: transform 0.13s ease, background 0.13s ease;
}

.quick-amounts button:active {
  transform: scale(0.94);
  background: var(--primary-soft);
}

.note-field {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--card-2);
  border: 1px solid var(--line);
}

.note-field .icon {
  width: 16px;
  height: 16px;
  color: var(--text-3);
  flex: none;
}

.note-field input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  outline: none;
  font-size: 16px;
}

.sheet-date {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  font-size: 10.5px;
  color: var(--text-3);
}

.sheet-date .icon {
  width: 13px;
  height: 13px;
}

.sheet-date em {
  margin-left: auto;
  font-style: normal;
}

/* 记账时间：直接输入 HH:MM */
.sheet-date-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0;
  font-size: 10.5px;
  color: var(--text-3);
  cursor: pointer;
}

.sheet-date-btn .icon {
  width: 13px;
  height: 13px;
}

.sheet-date-btn .sheet-caret {
  width: 11px;
  height: 11px;
  opacity: 0.5;
}

.sheet-date-btn:active {
  color: var(--primary-strong);
}

/* 系统日期选择器的载体：视觉隐藏但可唤起 */
.sheet-date-native {
  position: fixed;
  left: 8px;
  bottom: 8px;
  width: 1px;
  height: 1px;
  opacity: 0;
  border: 0;
  pointer-events: none;
}

.sheet-date .sheet-time {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border-radius: 11px;
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--text-2);
  cursor: text;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.sheet-date .sheet-time:focus-within {
  background: var(--primary-soft);
  border-color: var(--primary);
}

.sheet-time .icon {
  width: 13px;
  height: 13px;
  opacity: 0.75;
}

.sheet-time input {
  width: 48px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--text);
  font-size: 12.5px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  text-align: center;
  letter-spacing: 0.02em;
  outline: none;
}

.btn-save {
  margin-top: 13px;
  height: 52px;
  font-size: 16px;
}

/* ---------------- 弹窗 / 提示 ---------------- */

#modal-root {
  position: fixed;
  inset: 0;
  z-index: 120;
  pointer-events: none;
  display: grid;
  place-items: center;
  padding: 24px;
}

#modal-root.is-open {
  pointer-events: auto;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(10, 18, 12, 0.45);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 0.18s ease;
}

#modal-root.is-open .modal-backdrop {
  opacity: 1;
}

.modal {
  position: relative;
  width: min(340px, 100%);
  padding: 22px;
  border-radius: 24px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  animation: modal-in 0.22s cubic-bezier(0.22, 0.9, 0.3, 1) both;
}

/* 新版弹窗统一容器 */
.modal-card {
  position: relative;
  width: min(380px, 100%);
  max-height: 88dvh;
  overflow-y: auto;
  padding: 20px;
  border-radius: 24px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  animation: modal-in 0.22s cubic-bezier(0.22, 0.9, 0.3, 1) both;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}
.modal-head h3 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.modal-text {
  margin: 6px 0 12px;
  color: var(--text-2);
  font-size: 12.5px;
  line-height: 1.65;
}
.import-modal {
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ---------------- 分类管理弹窗 ---------------- */

.category-manager-modal {
  width: min(400px, 100%);
}

.modal-head-main {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.modal-sub {
  font-size: 11.5px;
  color: var(--text-3);
}

/* 拖拽排序：行首握把 + 跟随手指的浮层 + 占位槽 */
.cat-grip {
  flex: none;
  width: 20px;
  height: 34px;
  display: grid;
  place-items: center;
  color: var(--text-3);
  opacity: 0.7;
  touch-action: none;
  cursor: grab;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.cat-grip .icon {
  width: 18px;
  height: 18px;
}

.cat-grip:active {
  color: var(--primary-strong);
  opacity: 1;
}

.cat-grip.is-fixed,
.cat-grip:disabled {
  opacity: 0.22;
  cursor: default;
}

body.is-cat-dragging {
  cursor: grabbing;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}

.category-drag-ghost {
  position: fixed !important;
  z-index: 300;
  margin: 0 !important;
  pointer-events: none;
  box-shadow: 0 16px 34px rgba(24, 48, 32, 0.26);
  transform: translate3d(0, 0, 0);
  will-change: transform;
}

html[data-mode='dark'] .category-drag-ghost {
  box-shadow: 0 18px 38px rgba(0, 0, 0, 0.55);
}

.category-manage-row.is-drag-placeholder {
  background: var(--primary-soft);
  border: 1px dashed var(--primary);
}

.category-manage-row.is-drag-placeholder > * {
  visibility: hidden;
}

.category-add-form {
  margin: 2px 0 14px;
}

.category-field-label {
  margin-bottom: 7px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-3);
}

.icon-picker {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 2px 6px;
  margin: 0 -2px 8px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.icon-picker::-webkit-scrollbar {
  display: none;
}

.icon-pick {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: var(--text-3);
  background: var(--card-2);
  border: 1px solid transparent;
  transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}

.icon-pick .icon {
  width: 18px;
  height: 18px;
}

.icon-pick.is-active {
  color: var(--primary-strong);
  background: var(--primary-soft);
  border-color: var(--primary);
}

html[data-mode='dark'] .icon-pick.is-active {
  color: var(--primary);
}

.category-add-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.category-preview {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: var(--primary-strong);
  background: var(--primary-soft);
}

html[data-mode='dark'] .category-preview {
  color: var(--primary);
}

.category-preview .icon {
  width: 21px;
  height: 21px;
}

.category-add-row .modal-input {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 11px 12px;
}

.category-add-row .btn-primary {
  flex: none;
  min-height: 46px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 14px;
  border-radius: 14px;
}

.category-add-row .btn-primary .icon {
  width: 16px;
  height: 16px;
}

.category-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 40dvh;
  overflow-y: auto;
  padding-right: 2px;
  overscroll-behavior: contain;
}

.category-group-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 2px 5px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.02em;
}

.category-group-title span {
  font-weight: 500;
  opacity: 0.75;
}

.category-manage-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 15px;
  background: var(--card-2);
  border: 1px solid var(--line);
}

.category-manage-row + .category-manage-row {
  margin-top: 6px;
}

.category-manage-row .cat-icon {
  width: 34px;
  height: 34px;
  border-radius: 12px;
}

.category-manage-row .cat-icon .icon {
  width: 18px;
  height: 18px;
}

.category-manage-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.category-manage-main strong {
  font-size: 13.5px;
  font-weight: 650;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.category-manage-main > span:not(.category-name-line) {
  font-size: 10.5px;
  color: var(--text-3);
}

/* 名称区可点：点一下进入重命名 */
.category-manage-main.is-editable {
  text-align: left;
  color: inherit;
}

.category-name-line {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

.cat-rename-ico {
  width: 13px;
  height: 13px;
  flex: none;
  opacity: 0.38;
}

.category-manage-main.is-editable:active .cat-rename-ico {
  opacity: 0.9;
  color: var(--primary-strong);
}

/* 重命名弹窗 */
.rename-field {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 14px 0 2px;
}

.rename-field .modal-input {
  flex: 1;
  min-width: 0;
  margin: 0;
}

.category-tag,
.category-lock {
  flex: none;
  padding: 3px 7px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
  line-height: 1.3;
}

.category-tag {
  color: var(--primary-strong);
  background: var(--primary-soft);
}

html[data-mode='dark'] .category-tag {
  color: var(--primary);
}

.category-lock {
  color: var(--text-3);
  background: var(--bg-deep);
}

.category-manage-row .mini-btn {
  flex: none;
  width: 32px;
  height: 30px;
}

.category-manage-row .mini-btn.danger:active {
  background: rgba(217, 83, 79, 0.12);
}

/* 320~360px 小屏：让输入框优先拿到宽度，图标预览让位给图标条高亮 */
@media (max-width: 360px) {
  .category-preview {
    display: none;
  }
  .category-add-row {
    gap: 7px;
  }
  .category-add-row .btn-primary {
    padding: 0 12px;
    font-size: 13.5px;
  }
  .cat-grip {
    width: 16px;
  }
  /* 小屏给名称让宽度：图标缩小、三餐标签隐藏（分组标题里已标明） */
  .category-manage-row .cat-icon {
    width: 30px;
    height: 30px;
    border-radius: 10px;
  }
  .category-manage-row .cat-icon .icon {
    width: 16px;
    height: 16px;
  }
  .category-manage-row .category-tag {
    display: none;
  }
}

@keyframes modal-in {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.modal h3 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.modal p {
  margin-top: 7px;
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--text-2);
}

.modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 20px;
}

.modal-actions .btn-primary,
.modal-actions .btn-ghost {
  min-height: 46px;
  font-size: 14px;
}

.reminder-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--primary-soft);
  color: var(--primary);
  margin-bottom: 12px;
}

.reminder-icon .icon {
  width: 23px;
  height: 23px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 93px);
  transform: translate(-50%, 8px);
  z-index: 200;
  max-width: min(80vw, 360px);
  padding: 10px 16px;
  border-radius: 999px;
  background: rgba(22, 34, 26, 0.94);
  color: #fff;
  font-size: 12.5px;
  line-height: 1.4;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.24);
  backdrop-filter: blur(8px);
}

.toast.is-show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.toast.is-warn {
  background: rgba(150, 62, 48, 0.96);
}

.noscript {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: grid;
  place-items: center;
  padding: 30px;
  background: #f3f7f2;
  color: #1b2a21;
  text-align: center;
}

/* ---------------- 小屏适配 ---------------- */

@media (max-width: 360px) {
  .page {
    padding-left: 12px;
    padding-right: 12px;
  }
  .home-date {
    font-size: 25px;
  }
  .meal-card {
    min-height: 104px;
    padding: 11px 10px;
  }
  .meal-icon {
    width: 32px;
    height: 32px;
    margin-bottom: 7px;
  }
  .cat-btn {
    min-height: 76px;
  }
  .cat-icon {
    width: 34px;
    height: 34px;
  }

/* ==========================================================================
   新版首页：极简双按钮
   ========================================================================== */

.home-shell {
  display: flex;
  flex-direction: column;

}

.home-spacer {
  flex: 1;
  min-height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.home-quiet {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--text-3);
  user-select: none;
}

.home-quiet .icon {
  width: 34px;
  height: 34px;
  opacity: 0.32;
}

.home-quiet span {

  letter-spacing: 0.08em;
  opacity: 0.75;
}

.home-actions {

  gap: 11px;
  margin-top: auto;
}

.action-btn {
  position: relative;

  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  height: 108px;
  padding: 15px 15px 14px;
  border-radius: 24px;
  text-align: left;
  overflow: hidden;
  transition: transform 0.15s ease, filter 0.15s ease;
}

.action-btn:active {
  transform: scale(0.975);
}

.action-expense {
  color: #fff;
  background:
    radial-gradient(120% 130% at 100% 0%, rgba(255, 255, 255, 0.2), transparent 55%),
    linear-gradient(140deg, var(--primary), var(--primary-strong));

}

.action-income {
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.action-ico {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.18);
}

.action-ico .icon {
  width: 21px;
  height: 21px;
}

.action-income .action-ico {
  background: var(--primary-soft);
  color: var(--primary-strong);
}

html[data-mode='dark'] .action-income .action-ico {
  color: var(--primary);
}

.action-text strong {
  display: block;
  font-size: 19px;
  font-weight: 750;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.action-text span {
  display: block;
  margin-top: 1px;
  font-size: 10px;
  opacity: 0.72;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.home-hint {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 13px;
  font-size: 10.5px;
  color: var(--text-3);
}

.home-hint .icon {
  width: 13px;
  height: 13px;
}

/* 首页精简预算条 */
.budget-strip {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 12px;
  padding: 11px 13px 12px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  text-align: left;
  overflow: hidden;
}

.strip-icon {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--primary-soft);
  color: var(--primary-strong);
  flex: none;
}

html[data-mode='dark'] .strip-icon {
  color: var(--primary);
}

.strip-icon .icon {
  width: 18px;
  height: 18px;
}

.strip-main {
  flex: 1;
  min-width: 0;
}

.strip-main strong {
  display: block;
  font-size: 12px;
  font-weight: 650;
}

.strip-main > span {
  display: block;
  margin-top: 1px;
  font-size: 10px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.strip-value {
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex: none;
}

.budget-strip.is-over .strip-icon,
.budget-strip.is-over .strip-value {
  color: var(--danger);
  background: rgba(217, 83, 79, 0.1);
}

.budget-strip.is-over .strip-icon {
  color: var(--danger);
}

.budget-strip.is-empty .strip-value {
  font-size: 11.5px;
  color: var(--primary);
  font-weight: 600;
}

.strip-arrow {
  color: var(--text-3);
  flex: none;
  display: grid;
  place-items: center;
}

.strip-arrow .icon {
  width: 15px;
  height: 15px;
}

.strip-progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: var(--chart-track);
}

.strip-progress i {
  display: block;
  height: 100%;
  background: var(--primary);
  border-radius: 0 999px 999px 0;
}

.budget-strip.is-over .strip-progress i {
  background: var(--danger);
}

/* 首页账户总余额条：与预算条同构，金额默认打码 */
.balance-strip {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 12px;
  padding: 11px 13px 12px;
  border-radius: 18px;
  background:
    radial-gradient(120% 150% at 100% 0%, var(--primary-soft), transparent 58%),
    var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.15s ease;
}

.balance-strip:active {
  transform: scale(0.99);
}

.balance-strip:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.balance-strip + .budget-strip {
  margin-top: 9px;
}

.balance-strip .strip-main strong {
  font-size: 12px;
}

.balance-strip-icon {
  width: 34px;
  height: 34px;
  border-radius: 11px;
}

.balance-strip-icon .icon {
  width: 18px;
  height: 18px;
}

.balance-side {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
}

.balance-value {
  display: block;
  max-width: 156px;
  font-size: 18px;
  line-height: 1.2;
  font-weight: 750;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.balance-strip.is-masked .balance-value {
  font-size: 15px;
  letter-spacing: 0.12em;
  color: var(--text-2);
}

.balance-value.is-compact {
  font-size: 15px;
  letter-spacing: -0.03em;
}

.balance-strip.is-negative .balance-value {
  color: var(--danger);
}

.balance-value.is-setup {
  max-width: none;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0;
  color: var(--primary);
}

.balance-eye {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text-3);
  flex: none;
  transition: background 0.15s ease, color 0.15s ease;
}

.balance-eye:active {
  background: var(--primary-soft);
  color: var(--primary-strong);
}

.balance-eye .icon {
  width: 18px;
  height: 18px;
}

@media (max-width: 360px) {
  .balance-value {
    max-width: 112px;
    font-size: 17px;

  .balance-strip.is-masked .balance-value {
    font-size: 14px;
  }

    max-width: 132px;
    font-size: 14px;
  }

  }

html[data-mode='dark'] .balance-sheet-icon {

.balance-tip {

/* ==========================================================================
   分类选择面板（记一笔二级面板）

.cat-picker {

.picker-income > .icon {

.picker-tip {

.day-add-btn {

html[data-mode='dark'] .day-add-btn {

.day-cats-empty {

/* ==========================================================================
   解锁页 / 密码键盘 / 安全设置
   ========================================================================== */

.auth-page {
  min-height: 100dvh;
  width: 100%;
  padding: calc(14px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  align-items: center;
  background:
    radial-gradient(460px 260px at 50% -6%, var(--primary-soft), transparent 72%),
    var(--bg);
}

.auth-top {
  width: 100%;
  max-width: 360px;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.auth-back {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--text-2);
}

.auth-back .icon {
  width: 19px;
  height: 19px;
}

.auth-back-placeholder {
  width: 40px;
  height: 40px;
}

.auth-eyebrow {
  font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.1em;
}

.auth-logo {
  width: 66px;
  height: 66px;
  border-radius: 22px;
  display: grid;
  place-items: center;
  margin-top: 26px;
  background: var(--primary-soft);
  color: var(--primary-strong);
  box-shadow: 0 10px 26px rgba(40, 83, 54, 0.1);
}

.auth-logo.is-lock {
  background: var(--card);
  border: 1px solid var(--line);
}

html[data-mode='dark'] .auth-logo {
  color: var(--primary);
}

.auth-logo .icon {
  width: 30px;
  height: 30px;
}

.auth-title {
  margin: 16px 0 4px;
  font-size: 23px;
  line-height: 1.3;
  font-weight: 750;
  letter-spacing: -0.02em;
  text-align: center;
}

.auth-sub {
  margin: 0;
  max-width: 300px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-3);
  text-align: center;
}

.pin-dots {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 26px 0 8px;
}

.pin-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 1.6px solid var(--line);
  background: transparent;
  transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
}

.pin-dot.is-filled {
  background: var(--primary);
  border-color: var(--primary);
  transform: scale(1.06);
}

.pin-dots.is-error {
  animation: pin-shake 0.36s ease;
}

.pin-dots.is-error .pin-dot {
  border-color: var(--danger);
}

@keyframes pin-shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(3px); }
}

.auth-msg {
  min-height: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

  grid-template-columns: repeat(3, 1fr);
  gap: 12px;

.pin-key {
  height: 60px;
  border-radius: 18px;
  display: grid;
  place-items: center;

  background: var(--primary-soft);
}

.pin-key:disabled {
  opacity: 0.42;
}

  background: transparent;
  border-color: transparent;
  box-shadow: none;
  pointer-events: none;
}

.pin-key-text {
  font-size: 12px;
  font-weight: 550;
  color: var(--text-3);
  background: transparent;
  border-color: transparent;
  box-shadow: none;
}

  color: var(--text-2);
  background: var(--card-2);
  box-shadow: none;
}

.pin-key-icon .icon {
  width: 22px;
  height: 22px;
}

.auth-bio {
  width: 100%;
  max-width: 300px;
  height: 48px;
  margin-top: 14px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--primary-soft);
  color: var(--primary-strong);
  font-size: 12.5px;
  font-weight: 650;
}

  color: var(--primary);
}

.auth-bio:disabled {
  opacity: 0.65;
}

.auth-bio .icon {
  width: 20px;
  height: 20px;
}

.auth-bio.is-busy .icon {
  animation: auth-pulse 1s ease-in-out infinite;
}

@keyframes auth-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

.auth-bio-opt {
  width: 100%;
  max-width: 330px;
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
}

.auth-bio-opt.is-on {
  background: var(--primary-soft);
  border-color: transparent;
}

  width: 34px;
  height: 34px;
  border-radius: 11px;

  place-items: center;
  background: var(--card-2);
  color: var(--primary-strong);
  flex: none;
}

  color: var(--primary);

  min-width: 0;
}

.auth-bio-opt-main strong {
  display: block;
  font-size: 12px;
  font-weight: 650;
}

.auth-bio-opt-main em {
  display: block;
  margin-top: 1px;
  font-size: 9.5px;

  color: var(--text-3);
  text-align: center;

  width: 13px;
  height: 13px;
  flex: none;

/*!
 * 记把好账 · 基础工具
 * 日期、金额、下载、格式化等无依赖工具函数。
 */
(function (global) {
  'use strict';
  const QH = (global.QH = global.QH || {});
  const U = {};

  /* ---------------- 日期 ---------------- */

  const pad2 = (n) => String(n).padStart(2, '0');
  const WEEK_CN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const WEEK_SHORT = ['日', '一', '二', '三', '四', '五', '六'];

  U.pad2 = pad2;

  /** Date -> 'YYYY-MM-DD'（使用本地时间） */
  U.ymd = function (date) {
    const d = date instanceof Date ? date : new Date(date);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  };

  U.hm = function (date) {
    const d = date instanceof Date ? date : new Date(date);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  };

  /** 'YYYY-MM-DD' -> Date（落在中午，规避 DST 边界问题） */
  U.parseYmd = function (s) {
    if (!s) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
    if (!m) return null;
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12, 0, 0, 0);
  };

  U.isYmd = function (s) {
    return !!U.parseYmd(s);
  };

  U.today = function () {
    return U.ymd(new Date());
  };

  U.addDays = function (dateOrYmd, n) {
    const d = typeof dateOrYmd === 'string' ? U.parseYmd(dateOrYmd) : new Date(dateOrYmd);
    d.setDate(d.getDate() + n);
    return typeof dateOrYmd === 'string' ? U.ymd(d) : d;
  };

  U.addMonths = function (dateOrYmd, n) {
    const d = typeof dateOrYmd === 'string' ? U.parseYmd(dateOrYmd) : new Date(dateOrYmd);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    d.setDate(Math.min(day, U.daysInMonth(d.getFullYear(), d.getMonth())));
    return typeof dateOrYmd === 'string' ? U.ymd(d) : d;
  };

  U.daysInMonth = function (year, month /* 0-11 */) {
    return new Date(year, month + 1, 0).getDate();
  };

  U.startOfMonth = function (dateOrYmd) {
    const d = typeof dateOrYmd === 'string' ? U.parseYmd(dateOrYmd) : new Date(dateOrYmd);
    return new Date(d.getFullYear(), d.getMonth(), 1, 12);
  };

  /** 周一为一周起点 */
  U.startOfWeek = function (dateOrYmd) {
    const d = typeof dateOrYmd === 'string' ? U.parseYmd(dateOrYmd) : new Date(dateOrYmd);
    const offset = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - offset);
    return d;
  };

  U.endOfWeek = function (dateOrYmd) {
    return U.addDays(U.startOfWeek(dateOrYmd), 6);
  };

  U.diffDays = function (a, b) {
    const da = U.parseYmd(a);
    const db = U.parseYmd(b);
    return Math.round((da - db) / 86400000);
  };

  U.weekdayCN = function (dateOrYmd) {
    const d = typeof dateOrYmd === 'string' ? U.parseYmd(dateOrYmd) : dateOrYmd;
    return WEEK_CN[d.getDay()];
  };

  U.weekdayShort = function (i) {
    // i: 0 = 周一 ... 6 = 周日
    return ['一', '二', '三', '四', '五', '六', '日'][i];
  };

  U.monthLabel = function (dateOrYmd) {
    const d = typeof dateOrYmd === 'string' ? U.parseYmd(dateOrYmd) : dateOrYmd;
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
  };

  U.monthDayLabel = function (ymd) {
    const d = U.parseYmd(ymd);
    return d.getMonth() + 1 + '月' + d.getDate() + '日';
  };

  U.fullDateLabel = function (ymd) {
    const d = U.parseYmd(ymd);
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  };

  U.relativeDay = function (ymd) {
    const diff = U.diffDays(U.today(), ymd);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff === 2) return '前天';
    if (diff === -1) return '明天';
    return U.monthDayLabel(ymd);
  };

  U.greeting = function (date) {
    const h = (date || new Date()).getHours();
    if (h < 6) return '夜深了';
    if (h < 11) return '早上好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  };

  /** 生成某月日历网格（6 行 × 7 列，周一起始），返回 YYYY-MM-DD 数组 */
  U.monthGrid = function (year, month) {
    const first = new Date(year, month, 1, 12);
    const start = U.startOfWeek(first);
    const out = [];
    for (let i = 0; i < 42; i++) out.push(U.ymd(U.addDays(start, i)));
    return out;
  };

  U.weekDays = function (dateOrYmd) {
    const start = U.startOfWeek(dateOrYmd);
    const out = [];
    for (let i = 0; i < 7; i++) out.push(U.ymd(U.addDays(start, i)));
    return out;
  };

  U.quarter = function (dateOrYmd) {
    const d = typeof dateOrYmd === 'string' ? U.parseYmd(dateOrYmd) : dateOrYmd;
    return Math.floor(d.getMonth() / 3) + 1;
  };

  U.daysBetween = function (from, to) {
    return U.diffDays(to, from) + 1;
  };

  /* ---------------- 金额 ---------------- */

  U.round2 = function (n) {
    return Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  };

  U.toNumber = function (v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    const n = parseFloat(String(v == null ? '' : v).replace(/[^\d.-]/g, ''));
    return isFinite(n) ? n : 0;
  };

  /** 千分位，始终两位小数 */
  U.money = function (n, symbol) {
    const num = U.round2(U.toNumber(n));
    const parts = num.toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (symbol == null ? '¥' : symbol) + parts.join('.');
  };

  /** 千分位，整数时省略小数（用于按钮、快捷金额） */
  U.moneyShort = function (n, symbol) {
    const num = U.round2(U.toNumber(n));
    const isInt = Math.abs(num - Math.round(num)) < 0.005;
    const parts = (isInt ? String(Math.round(num)) : num.toFixed(2)).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (symbol == null ? '¥' : symbol) + parts.join('.');
  };

  /** 日历格子里的紧凑数字：1234 -> 1.2k；12000 -> 1.2万 */
  U.compact = function (n) {
    const num = Math.abs(U.toNumber(n));
    if (num >= 10000) return (num / 10000).toFixed(num >= 100000 ? 0 : 1).replace(/\.0$/, '') + '万';
    if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    if (num >= 100) return String(Math.round(num));
    if (num === 0) return '';
    return num % 1 === 0 ? String(num) : num.toFixed(0);
  };

  /** 图表轴标签：1200 -> 1.2k */
  U.axisShort = function (n) {
    const num = Math.abs(n);
    if (num >= 10000) return (num / 10000).toFixed(1).replace(/\.0$/, '') + '万';
    if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    if (num >= 1) return String(Math.round(num));
    return '0';
  };

  U.percent = function (part, total) {
    if (!total) return 0;
    return (part / total) * 100;
  };

  U.percentText = function (part, total, digits) {
    const p = U.percent(part, total);
    if (!isFinite(p)) return '0%';
    return (digits ? p.toFixed(digits) : Math.round(p)) + '%';
  };

  /* ---------------- 其它 ---------------- */

  U.uid = function () {
    if (global.crypto && typeof global.crypto.randomUUID === 'function') {
      return global.crypto.randomUUID();
    }
    return 'tx_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
  };

  U.escapeHTML = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  };

  U.debounce = function (fn, wait) {
    let timer = null;
    return function () {
      const args = arguments;
      const ctx = this;
      clearTimeout(timer);
      timer = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  };

  U.clamp = function (n, min, max) {
    return Math.max(min, Math.min(max, n));
  };

  U.sum = function (arr, pick) {
    return arr.reduce(function (acc, item) {
      return acc + (pick ? U.toNumber(pick(item)) : U.toNumber(item));
    }, 0);
  };

  U.groupBy = function (arr, keyFn) {
    const map = new Map();
    arr.forEach(function (item) {
      const k = keyFn(item);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(item);
    });
    return map;
  };

  /** 下载 Blob（iOS Safari 也兼容；Android / Windows 桌面壳交给原生桥保存） */
  U.download = function (filename, blob) {
    const nativeShell = window.QHAndroid || window.QHDesktop;
    if (nativeShell && typeof nativeShell.saveFile === 'function' && typeof FileReader !== 'undefined') {
      try {
        const reader = new FileReader();
        reader.onload = function () {
          const data = String(reader.result || '');
          const comma = data.indexOf(',');
          if (comma > 0) {
            nativeShell.saveFile(filename, blob.type || 'application/octet-stream', data.slice(comma + 1));
          }
        };
        reader.readAsDataURL(blob);
        return;
      } catch (e) { /* 桥不可用时回退到浏览器下载 */ }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 800);
  };

  U.fileStamp = function () {
    const d = new Date();
    return U.ymd(d) + '_' + pad2(d.getHours()) + pad2(d.getMinutes());
  };

  U.copy = function (obj) {
    return JSON.parse(JSON.stringify(obj));
  };

  QH.Utils = U;
})(window);

</script>

    { id: 'lunch', name: '午餐', icon: 'bowl', color: '#4F9D69', meal: true, type: 'expense' },

    { id: 'snack', name: '加餐', icon: 'snack', color: '#C97B4A', type: 'expense' },
    { id: 'transport', name: '交通', icon: 'bus', color: '#5B8DEF', type: 'expense' },
    { id: 'shopping', name: '购物', icon: 'bag', color: '#D97A9B', type: 'expense' },
